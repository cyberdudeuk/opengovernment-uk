name: Refresh
# Run by hand. Reads every source again, rebuilds and checks; the rebuilt site is attached to the run for review.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python tools/fetch.py
      - run: python tools/build.py
      - run: python tools/check.py && python tools/check.py --negative
      - run: python tools/patch_portal.py && python tools/export_bods.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-site
          path: |
            docs/
            data/
            sources/manifest.json
