name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Portal page and BODS file build cleanly (the generators the refresh runs; OG-D76)
        run: python tools/patch_portal.py && python tools/export_bods.py
      - name: Licensing is machine-readable and complete (REUSE 3.3; every file has a licence and copyright)
        run: reuse lint
      - name: Lint (fails on any finding)
        run: ruff check tools
      - name: Accountability checks
        run: python tools/check.py
      - name: Every check fails when it should
        run: python tools/check.py --negative
      - name: Back-office classes A and B (known answers, proven to fail when broken)
        run: python tools/check_functions.py && python tools/check_functions.py --negative
      - name: Trends, 2020 reconciliation and 2030 scenarios
        run: python tools/check_trends.py && python tools/check_trends.py --negative
      - name: BODS normative rules (Open Ownership's own checker; any finding fails)
        run: |
          libcovebods jsv docs/bods-0.4.json | python -c "import json,sys; e=json.load(sys.stdin); sys.exit(f'schema errors: {len(e)}' if e else 0)"
          libcovebods pv docs/bods-0.4.json | python -c "import json,sys; a=json.load(sys.stdin)['additional_checks']; sys.exit(f'BODS rule findings: {len(a)}' if a else 0)"
      - name: Nation evidence and the 2020 layer (known answers, negatives)
        run: python tools/nation_evidence.py --verify && python tools/nation_evidence.py --negative
      - name: Plain-English classification (known answers, negative)
        run: python tools/classify.py && python tools/classify.py --negative
      - name: Set-aside near-name pairs decided (nation rule, evidenced nations, Wikidata, quoted official pages; negatives)
        run: python tools/setaside.py && python tools/setaside.py --negative
      - name: One record per body (same-as layer; known answers, never merged across identifiers, negatives)
        run: python tools/sameas.py && python tools/sameas.py --negative
      - name: Crown Dependencies and Overseas Territories (founding orders, confirmed websites, negatives)
        run: python tools/territories.py && python tools/territories.py --negative
      - name: The UK in international bodies (official sources only, open register leads, roles not people, negatives)
        run: python tools/international.py && python tools/international.py --negative
      - name: Rules, standards and guidance for each body (official sources, known answers, negatives)
        run: python tools/instruments.py && python tools/instruments.py --negative
      - name: The UK's memberships, treaties and agreements (known answers, negatives)
        run: python tools/relations.py && python tools/relations.py --negative
      - name: UK shareholdings in international financial institutions (each institution's own table; LEIs and Wikidata read back; negatives)
        run: python tools/intl_ownership.py && python tools/intl_ownership.py --negative
      - name: Org charts (every open body placed once, parents before children, known answer, negatives)
        run: python tools/orgchart.py && python tools/orgchart.py --negative
      - name: Funding, grants, schemes and innovation services (givers in the register, council org-ids checked, negatives)
        run: python tools/funding.py && python tools/funding.py --negative
      - name: Personas and journeys (every route leads somewhere real, negatives)
        run: python tools/personas.py && python tools/personas.py --negative
      - name: World map of treaty partners (every partner placed or recorded; known answers; negatives)
        run: python tools/worldmap.py && python tools/worldmap.py --negative
      - name: Cooperation by country (Commonwealth, trade agreements in effect, tax treaties, kinds of treaty; official sources; negatives)
        run: python tools/cooperation.py && python tools/cooperation.py --negative
      - name: The UK and the world section (known answers, every standard file published, negatives)
        run: python tools/world.py && python tools/world.py --negative
      - name: Each body's own website (one combined table; codes, and official council lists by exact name; negatives)
        run: python tools/websites.py && python tools/websites.py --negative
      - name: Trading fund and public corporation trees (one place each, known answers, negatives)
        run: python tools/corporations.py && python tools/corporations.py --negative
      - name: Local government under the English Devolution Act 2026 (every fact sourced, 21 areas, negatives)
        run: python tools/localgov.py && python tools/localgov.py --negative
      - name: Builds are deterministic (built twice with different hash seeds; any difference fails, OG-D61)
        run: |
          for t in funding cooperation setaside worldmap intl_ownership ftm_export; do PYTHONHASHSEED=1 python tools/$t.py >/dev/null; done; cp docs/funding.html /tmp/a.html; cp data/cooperation.json /tmp/a.json; cp data/set-aside.json /tmp/b.json; cp data/worldmap.json /tmp/c.json; cp docs/data/register.ftm.json /tmp/d.json
          for t in funding cooperation setaside worldmap intl_ownership ftm_export; do PYTHONHASHSEED=2 python tools/$t.py >/dev/null; done; cmp /tmp/a.html docs/funding.html && cmp /tmp/a.json data/cooperation.json && cmp /tmp/b.json data/set-aside.json && cmp /tmp/c.json data/worldmap.json && cmp /tmp/d.json docs/data/register.ftm.json
      - name: FollowTheMoney export (checked against FtM's own model; negatives)
        run: python tools/ftm_export.py && python tools/ftm_export.py --negative
      - name: Public-sector BODS test cases (shared fixture-pack layout; lib-cove-bods; negative)
        run: python tools/bods_fixtures_ps.py && python tools/bods_fixtures_ps.py --negative
      - name: Sources meet their expected counts; source status published (fail closed; negatives)
        run: python tools/sources_check.py && python tools/sources_check.py --negative
      - name: Masthead feeds on every page (notifications, latest changes, search index; safe links only; negatives)
        run: python tools/alerts.py && python tools/alerts.py --negative
      - name: Developer hub (crosswalk cells checked against the real files and models; OpenAPI paths published; links live; negatives)
        run: python tools/devhub.py && python tools/devhub.py --negative
      - name: MCP connector (known answers from the published files; live server over stdio with the pinned SDK; negatives)
        run: pip install -r integrations/mcp/requirements.txt && python tools/mcp_check.py && python tools/mcp_check.py --negative
      - name: Nations and documentation (known answers, traceability, negatives)
        run: python tools/nations.py && python tools/nations.py --negative && python tools/artefacts.py && python tools/artefacts.py --negative
      - name: Design system (contrast in light and dark, every page on the shared tokens, no third-party fonts, negatives)
        run: python tools/design.py && python tools/design.py --negative && python tools/design.py --audit
      - name: SQLite for Datasette Lite and org-id identifiers (negatives)
        run: python tools/sqlite_export.py && python tools/sqlite_export.py --negative
      - name: BODS output validates against the official schema
        run: python tools/export_bods.py
      - name: Open standards for harvesting (DCAT, ORG, schema.org, SKOS, PROV, CSVW, Frictionless; every graph parsed back; negatives)
        run: python tools/standards.py && python tools/standards.py --negative
      - name: Agent instructions answer their known questions from the published files (negative)
        run: python tools/agent_evals.py && python tools/agent_evals.py --negative
      - name: Every page in a real browser (phone and desktop, light and dark; no script errors, no overflow, masthead clear; negative)
        run: python -m playwright install --with-deps chromium && python tools/browser_check.py && python tools/browser_check.py --negative
      - name: Published page carries no email address or former office name
        run: |
          ! grep -Eq '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(gov|org|com|uk|net)\b' docs/index.html
          ! grep -q 'Office of the Chief Data Officer' docs/index.html
      - name: Committed outputs match a fresh build (nothing generated was left uncommitted; OG-D76)
        run: git diff --stat --exit-code -- docs data ':!docs/opengovernment-uk.db'
